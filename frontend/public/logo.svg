<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brand-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c66" />
      <stop offset="60%" stop-color="#0a5c4c" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="badge-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base rounded-square badge -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#brand-bg)" filter="url(#badge-shadow)" />
  <rect x="26" y="26" width="460" height="460" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4" />

  <!-- Amber sunbeam / accent dot in top right -->
  <circle cx="410" cy="102" r="14" fill="url(#amber-accent)" />

  <!-- Center Storefront Icon (Geometry aligned with Lucide Store at 12.5x scale) -->
  <g transform="translate(106, 106) scale(12.5)" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Store Lower Walls -->
    <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" />
    <!-- Doorway -->
    <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" />
    <!-- Awning Canopy -->
    <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244" />
  </g>

  <!-- Accent Awning highlight dot -->
  <circle cx="256" cy="226" r="6" fill="#fbbf24" />
</svg>
