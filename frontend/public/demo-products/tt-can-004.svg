      <path d="M141 190 C180 205 332 205 371 190 L371 196 C332 211 180 211 141 196 Z" fill="#d7ee2b" opacity="0.8" />
      <path d="M141 345 C180 360 332 360 371 345 L371 351 C332 366 180 366 141 351 Z" fill="#d7ee2b" opacity="0.8" />

