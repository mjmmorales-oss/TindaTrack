      <text x="256" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#4b5563" text-anchor="middle">Beef</text>
      
        <rect x="206" y="298" width="100" height="26" rx="13" fill="#b8631e" />
        <text x="256" y="316" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#ffffff" text-anchor="middle">150g</text>
      

