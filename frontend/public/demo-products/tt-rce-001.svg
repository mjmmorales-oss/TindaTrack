<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="none" />
  <g id="packshot">
    <!-- Base Ground Shadow -->
      <ellipse cx="256" cy="460" rx="135" ry="24" fill="black" opacity="0.14" />

      <!-- 3D Box Carton -->
      <path d="M146 130 L366 130 L366 430 L146 430 Z" fill="url(#boxFront)" />
      <path d="M146 130 L200 80 L420 80 L366 130 Z" fill="#40dd8f" />
      <path d="M366 130 L420 80 L420 380 L366 430 Z" fill="#127d47" />

      <!-- Center Label Area -->
      <rect x="166" y="190" width="180" height="180" rx="14" fill="#ffffff" opacity="0.95" />
      <rect x="166" y="190" width="180" height="8" rx="4" fill="#2bcdee" />

      <!-- Text -->
      <text x="256" y="255" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#111827" text-anchor="middle">Well-milled Rice</text>
      
      

      <defs>
        <linearGradient id="boxFront" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#40dd8f" />
          <stop offset="60%" stop-color="#1eb86b" />
          <stop offset="100%" stop-color="#127d47" />
        </linearGradient>
      </defs>
  </g>
</svg>