<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="none" />
  <g id="packshot">
    <!-- Base Ground Shadow -->
      <ellipse cx="256" cy="450" rx="140" ry="24" fill="black" opacity="0.12" />

      <!-- Soap Bar Body -->
      <rect x="136" y="140" width="240" height="280" rx="40" fill="url(#barGrad)" />

      <!-- Bevel Edge Emboss -->
      <rect x="156" y="160" width="200" height="240" rx="30" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.4" />

      <!-- Center Brand Band -->
      <rect x="136" y="220" width="240" height="120" fill="#ffffff" opacity="0.9" />
      <rect x="136" y="220" width="240" height="6" fill="#ee2e2b" />
      <rect x="136" y="334" width="240" height="6" fill="#ee2e2b" />

      <!-- Text -->
      <text x="256" y="272" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" fill="#1f2937" text-anchor="middle">Safeguard Pure</text>
      <text x="256" y="302" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="18" fill="#4b5563" text-anchor="middle">White</text>
      
        <rect x="211" y="360" width="90" height="24" rx="12" fill="#b81e82" />
        <text x="256" y="377" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle">60g</text>
      

      <defs>
        <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#dd40a6" />
          <stop offset="50%" stop-color="#b81e82" />
          <stop offset="100%" stop-color="#7d1257" />
        </linearGradient>
      </defs>
  </g>
</svg>