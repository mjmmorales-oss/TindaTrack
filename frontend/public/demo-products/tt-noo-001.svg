<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="none" />
  <g id="packshot">
    <!-- Base Ground Shadow -->
      <ellipse cx="256" cy="462" rx="140" ry="22" fill="black" opacity="0.14" />

      <!-- Pillow Pack Contour -->
      <path d="M126 100 C150 90 362 90 386 100 C406 200 406 320 386 420 C362 430 150 430 126 420 C106 320 106 200 126 100 Z" fill="url(#packGrad)" />

      <!-- Top and Bottom Crimped Ribs -->
      <path d="M126 100 C150 90 362 90 386 100 L382 120 C360 112 152 112 130 120 Z" fill="#7d6412" opacity="0.7" />
      <path d="M126 420 C150 430 362 430 386 420 L382 400 C360 408 152 408 130 400 Z" fill="#7d6412" opacity="0.7" />

      <!-- Dynamic Diagonal Band -->
      <path d="M116 220 Q256 250 396 210 L392 330 Q256 370 118 340 Z" fill="#ffffff" opacity="0.95" />
      <path d="M116 220 Q256 250 396 210 L395 224 Q256 264 116 234 Z" fill="#99ee2b" />

      <!-- Highlight Arc -->
      <path d="M136 130 Q116 260 136 390 Q146 390 146 130 Z" fill="#ffffff" opacity="0.25" />

      <!-- Product Text on Band -->
      <text x="256" y="272" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#111827" text-anchor="middle">Lucky Me!</text>
      <text x="256" y="306" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#4b5563" text-anchor="middle">Pancit Canton</text>
      

      <defs>
        <linearGradient id="packGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ddb940" />
          <stop offset="50%" stop-color="#b8941e" />
          <stop offset="100%" stop-color="#7d6412" />
        </linearGradient>
      </defs>
  </g>
</svg>